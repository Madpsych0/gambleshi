# =============================================================================
# Gambleshi CI/CD Pipeline — GitHub Actions
# =============================================================================
# Triggers on push to main and PRs. Builds, tests, containerizes, and deploys
# to OpenShift. All builds happen in GitHub's cloud runners — nothing local.
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_REGISTRY: quay.io
  IMAGE_NAME: ${{ secrets.REGISTRY_USERNAME }}/gambleshi
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ===========================================================================
  # Job 1: Build & Test
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          if grep -q '"test"' package.json; then
            npm test
          else
            echo "No test script found, skipping tests"
          fi

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ===========================================================================
  # Job 2: Build & Push Container Image
  # ===========================================================================
  build-image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

  # ===========================================================================
  # Job 3: Deploy to OpenShift
  # ===========================================================================
  deploy:
    name: Deploy to OpenShift
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        run: |
          curl -sLO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz kubectl
          oc version --client

      - name: Login to OpenShift
        run: |
          oc login --token=${{ secrets.OPENSHIFT_TOKEN }} \
                   --server=${{ secrets.OPENSHIFT_SERVER }} \
                   --insecure-skip-tls-verify=true

      - name: Switch to project
        run: |
          oc project navaneethfr-dev

      - name: Update image tag in deployment
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|g" \
            k8s/deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          # Apply in dependency order (skip namespace.yaml — project already exists on Sandbox)
          oc apply -f k8s/configmap.yaml
          oc apply -f k8s/rbac.yaml
          oc apply -f k8s/networkpolicy.yaml
          oc apply -f k8s/deployment.yaml
          oc apply -f k8s/service.yaml
          oc apply -f k8s/route.yaml
          oc apply -f k8s/hpa.yaml
          oc apply -f k8s/pdb.yaml

      - name: Wait for rollout
        run: |
          oc rollout status deployment/gambleshi -n navaneethfr-dev --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          oc get pods -n navaneethfr-dev
          echo ""
          echo "=== Route ==="
          oc get route gambleshi -n navaneethfr-dev -o jsonpath='{.spec.host}'
          echo ""
          echo ""
          echo "=== HPA ==="
          oc get hpa -n navaneethfr-dev

      - name: Smoke test
        run: |
          ROUTE_HOST=$(oc get route gambleshi -n navaneethfr-dev -o jsonpath='{.spec.host}')
          echo "Testing https://${ROUTE_HOST}/healthz"
          for i in 1 2 3 4 5; do
            if curl -sf "https://${ROUTE_HOST}/healthz" -o /dev/null; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed after 5 attempts"
          exit 1

