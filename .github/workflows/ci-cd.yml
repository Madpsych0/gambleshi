# =============================================================================
# Gambleshi CI/CD Pipeline — GitHub Actions
# =============================================================================
# Triggers on push to main and PRs. Builds, tests, and deploys to OpenShift.
# Uses OpenShift's internal registry — no external registry needed.
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===========================================================================
  # Job 1: Build & Test
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          if grep -q '"test"' package.json; then
            npm test
          else
            echo "No test script found, skipping tests"
          fi

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ===========================================================================
  # Job 2: Build Image on OpenShift & Deploy
  # ===========================================================================
  deploy:
    name: Build & Deploy to OpenShift
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        run: |
          curl -sLO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz kubectl
          oc version --client

      - name: Login to OpenShift
        run: |
          oc login --token=${{ secrets.OPENSHIFT_TOKEN }} \
                   --server=${{ secrets.OPENSHIFT_SERVER }} \
                   --insecure-skip-tls-verify=true

      - name: Switch to project
        run: |
          oc project navaneethfr-dev

      - name: Create BuildConfig (first run only)
        run: |
          if ! oc get bc gambleshi -n navaneethfr-dev &>/dev/null; then
            oc new-build --name=gambleshi \
              --binary=true \
              --strategy=docker \
              -n navaneethfr-dev
          else
            echo "BuildConfig already exists, skipping creation"
          fi

      - name: Create game-event-handler BuildConfig (first run only)
        run: |
          if ! oc get bc game-event-handler -n navaneethfr-dev &>/dev/null; then
            oc new-build --name=game-event-handler \
              --binary=true \
              --strategy=docker \
              -n navaneethfr-dev
          else
            echo "BuildConfig already exists, skipping creation"
          fi

      - name: Build main app image on OpenShift
        run: |
          oc start-build gambleshi \
            --from-dir=. \
            --follow \
            --wait \
            -n navaneethfr-dev

      - name: Build game-event-handler image on OpenShift
        run: |
          oc start-build game-event-handler \
            --from-dir=serverless/game-event-handler \
            --follow \
            --wait \
            -n navaneethfr-dev

      - name: Update image references in manifests
        run: |
          # Get the internal registry image references
          MAIN_IMAGE=$(oc get istag gambleshi:latest -n navaneethfr-dev -o jsonpath='{.image.dockerImageReference}')
          HANDLER_IMAGE=$(oc get istag game-event-handler:latest -n navaneethfr-dev -o jsonpath='{.image.dockerImageReference}')
          echo "Main app image: ${MAIN_IMAGE}"
          echo "Handler image: ${HANDLER_IMAGE}"
          sed -i "s|IMAGE_PLACEHOLDER|${MAIN_IMAGE}|g" k8s/deployment.yaml
          sed -i "s|IMAGE_PLACEHOLDER_HANDLER|${HANDLER_IMAGE}|g" k8s/game-event-handler.yaml

      - name: Apply Kubernetes manifests
        run: |
          # Apply in dependency order (skip namespace.yaml — project already exists on Sandbox)
          oc apply -f k8s/configmap.yaml
          oc apply -f k8s/rbac.yaml
          oc apply -f k8s/networkpolicy.yaml
          oc apply -f k8s/deployment.yaml
          oc apply -f k8s/service.yaml
          oc apply -f k8s/route.yaml
          oc apply -f k8s/hpa.yaml
          oc apply -f k8s/pdb.yaml
          oc apply -f k8s/game-event-handler.yaml

      - name: Wait for rollouts
        run: |
          oc rollout status deployment/gambleshi -n navaneethfr-dev --timeout=300s
          oc rollout status deployment/game-event-handler -n navaneethfr-dev --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          oc get pods -n navaneethfr-dev
          echo ""
          echo "=== Routes ==="
          oc get routes -n navaneethfr-dev
          echo ""
          echo "=== HPA ==="
          oc get hpa -n navaneethfr-dev

      - name: Smoke test
        run: |
          ROUTE_HOST=$(oc get route gambleshi -n navaneethfr-dev -o jsonpath='{.spec.host}')
          echo "Testing https://${ROUTE_HOST}/healthz"
          for i in 1 2 3 4 5; do
            if curl -sf "https://${ROUTE_HOST}/healthz" -o /dev/null; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed after 5 attempts"
          exit 1

