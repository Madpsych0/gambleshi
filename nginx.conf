# =============================================================================
# Nginx Configuration for Gambleshi (OpenShift-Compatible)
# =============================================================================

# Run as non-root — pid file in writable location
pid /var/run/nginx.pid;

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # --------------------------------------------------------------------------
    # Basic Settings
    # --------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Hide nginx version in headers
    server_tokens off;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # --------------------------------------------------------------------------
    # Temp paths (must be writable by non-root user)
    # --------------------------------------------------------------------------
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # --------------------------------------------------------------------------
    # Main Server Block
    # --------------------------------------------------------------------------
    server {
        listen 8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ------------------------------------------------------------------
        # Security Headers
        # ------------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com; frame-src 'none';" always;

        # ------------------------------------------------------------------
        # SPA Routing — fallback to index.html for client-side routes
        # ------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ------------------------------------------------------------------
        # Cache hashed static assets aggressively (Vite generates hashed filenames)
        # ------------------------------------------------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ------------------------------------------------------------------
        # Cache other static files
        # ------------------------------------------------------------------
        location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # ------------------------------------------------------------------
        # Plinko outcomes JSON (large file, cache it)
        # ------------------------------------------------------------------
        location = /plinko-outcomes.json {
            expires 7d;
            add_header Cache-Control "public";
        }

        # ------------------------------------------------------------------
        # Health check endpoint for Kubernetes probes
        # ------------------------------------------------------------------
        location = /healthz {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # ------------------------------------------------------------------
        # Nginx stub_status for Prometheus metrics scraping
        # ------------------------------------------------------------------
        location = /nginx_status {
            stub_status on;
            access_log off;
            # In OpenShift, access is controlled by NetworkPolicy
        }

        # ------------------------------------------------------------------
        # Deny access to hidden files
        # ------------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Custom error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
