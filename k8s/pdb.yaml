# =============================================================================
# Pod Disruption Budget — High Availability guarantee
# =============================================================================
# Ensures at least 2 pods remain available during voluntary disruptions
# (node drains, cluster upgrades, maintenance windows).
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gambleshi
  namespace: navaneethfr-dev
  labels:
    app.kubernetes.io/name: gambleshi
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: gambleshi
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gambleshi
      app.kubernetes.io/component: frontend
