# =============================================================================
# Game Event Handler — Standard Deployment
# =============================================================================
# Replaces Knative Service for environments without OpenShift Serverless.
# Runs as a regular pod with autoscaling via HPA.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-event-handler
  namespace: navaneethfr-dev
  labels:
    app.kubernetes.io/name: game-event-handler
    app.kubernetes.io/component: serverless
    app.kubernetes.io/part-of: gambleshi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: game-event-handler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: game-event-handler
        app.kubernetes.io/component: serverless
        app.kubernetes.io/part-of: gambleshi
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: handler
          image: IMAGE_PLACEHOLDER_HANDLER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: game-event-handler
  namespace: navaneethfr-dev
  labels:
    app.kubernetes.io/name: game-event-handler
    app.kubernetes.io/component: serverless
    app.kubernetes.io/part-of: gambleshi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: game-event-handler
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: game-event-handler
  namespace: navaneethfr-dev
  labels:
    app.kubernetes.io/name: game-event-handler
    app.kubernetes.io/component: serverless
    app.kubernetes.io/part-of: gambleshi
spec:
  to:
    kind: Service
    name: game-event-handler
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
